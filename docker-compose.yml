services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasksync-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required; copy .env.example to .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MSSQL_HOST=${MSSQL_HOST:-sqlserver}
      - MSSQL_PORT=${MSSQL_PORT:-1433}
      - MSSQL_DATABASE=${MSSQL_DATABASE:-TaskSyncEnterprise}
      - MSSQL_USER=${MSSQL_USER:-sa}
      - MSSQL_PASSWORD=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    restart: always

  redis:
    image: redis:7-alpine
    container_name: tasksync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tasksync-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tasksync-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      - MSSQL_DATABASE=${MSSQL_DATABASE:-TaskSyncEnterprise}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C
        -Q "IF DB_ID(N'$${MSSQL_DATABASE}') IS NULL CREATE DATABASE [$${MSSQL_DATABASE}]"
    restart: "no"

volumes:
  redis_data:
  mssql_data:
