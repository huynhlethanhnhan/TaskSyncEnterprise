<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* CSS Resets & Base Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f8fafc;
            padding: 40px 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .content {
            padding: 32px;
        }
        /* Components styling mapping to BrandTheme */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            color: #ffffff !important;
            background-color: #0f172a;
            text-align: center;
            margin: 16px 0;
        }
        .btn-primary {
            background-color: #2563eb;
        }
        .card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin: 16px 0;
        }
        .divider {
            height: 1px;
            background-color: #e2e8f0;
            margin: 24px 0;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 9999px;
            text-transform: uppercase;
        }
        .badge-high {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .badge-normal {
            background-color: #f1f5f9;
            color: #475569;
        }
        h1, h2, h3 {
            color: #0f172a;
            margin-top: 0;
        }
        .meta-table th {
            text-align: left;
            padding: 8px 12px 8px 0;
            color: #64748b;
            font-weight: 500;
            width: 130px;
            font-size: 14px;
        }
        .meta-table td {
            padding: 8px 0;
            color: #0f172a;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <table class="wrapper">
        <tr>
            <td align="center">
                <table class="container">
                    <!-- HEADER BLOCK -->
                    <tr>
                        <td>
                            {% include 'base/header.html' %}
                        </td>
                    </tr>
                    
                    <!-- CONTENT BLOCK -->
                    <tr>
                        <td class="content">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    
                    <!-- FOOTER BLOCK -->
                    <tr>
                        <td>
                            {% include 'base/footer.html' %}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
