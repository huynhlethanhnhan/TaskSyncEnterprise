{% extends 'base/layout.html' %}
{% block content %}
<h2>New Comment on Task</h2>
<p>Hello {{ employee_name }},</p>
<p>A new comment was added to the task: <strong>{{ task_title }}</strong>.</p>

<div class="card">
    <p style="margin: 0 0 8px 0; font-size: 14px; color: #64748b; font-weight: 500;">
        {{ actor_name }} commented:
    </p>
    <blockquote style="margin: 0; padding-left: 12px; border-left: 4px solid #2563eb; font-style: italic; color: #0f172a;">
        "{{ comment_body }}"
    </blockquote>
</div>

<div style="text-align: center; margin-top: 24px;">
    <a href="#" class="btn btn-primary">Reply to Comment</a>
</div>
{% endblock %}
