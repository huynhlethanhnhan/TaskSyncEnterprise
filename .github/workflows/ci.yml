name: CI Foundation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so that we can check changed files

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff check
        run: |
          cd backend
          ruff check .

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            backend/**/*.py
          json: true

      - name: Run Black check
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          python -c '
          import json, subprocess, sys, os
          files = json.loads(r"""${{ steps.changed-files.outputs.all_changed_files }}""")
          existing_files = [f for f in files if os.path.exists(f)]
          if existing_files:
              cmd = ["black", "--check"] + existing_files
              print(f"Running: {\" \".join(cmd)}")
              res = subprocess.run(cmd)
              sys.exit(res.returncode)
          else:
              print("No existing Python files changed.")
          '

      - name: Run Pytest
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term tests/

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify production build
        run: |
          cd frontend
          npm run build
