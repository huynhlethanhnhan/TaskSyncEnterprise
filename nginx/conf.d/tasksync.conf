# Upstream service declarations using Docker service DNS
upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:8080;
    keepalive 16;
}

# WebSocket upgrade handling map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP Gateway Server (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Nginx container health check endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # Security: Disable directory listing globally
    autoindex off;

    # Security: Block hidden files and sensitive configuration files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block sensitive file extensions
    location ~* \.(env|git|key|pem|log|bak|swp|sh|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # API Routes Reverse Proxy -> FastAPI Backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Standard forwarded headers required by backend proxy awareness
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Authenticated real-time notification stream.
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Swagger / OpenAPI & Health Check Endpoints -> Backend
    location ~ ^/(docs|redoc|openapi\.json|health|metrics) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Uploaded Media / Static Files -> Backend
    location /uploads/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Frontend SPA Reverse Proxy -> React Application Container
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}

